[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-task-crontab"
version = "2026.05.08.02"
description = "Crontab Tier 2 client for ophix-tasks — applies task schedules to /etc/cron.d"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
dependencies = [
    "ophix-client-core>=2026.05.08.01",
    "ophix-task-client>=2026.05.07.02",
]

[project.scripts]
task-crontab = "ophix_task_crontab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
